version: 1.3.17
cache: true
fileStrategy: "local"
fileStrategies:
  default: "local"
  avatar: "local"
  image: "local"
  document: "s3"
interface:
  customWelcome: "Welcome to Convor AI"
  endpointsMenu: false
  modelSelect: false
  parameters: false
  sidePanel: true
  presets: false
  bookmarks: false
  multiConvo: false
  prompts:
    use: false
    create: false
  agents:
    use: true
    create: true
    share: true
  mcpServers:
    use: false
    create: false
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: true
  remoteAgents:
    use: true
    create: true
    share: false
    public: false
  memories: false
  skills: true
endpoints:
  assistants:
    disableBuilder: false
    pollIntervalMs: 750
    timeoutMs: 180000
    capabilities:
      - "code_interpreter"
      - "retrieval"
      - "actions"
      - "tools"
      - "image_vision"
modelSpecs:
  enforce: true
  prioritize: true
  addedEndpoints:
    - agents
  list:
    - name: "hr-engine"
      label: "People Ops Assistant"
      description: "Policies, benefits, onboarding and hiring"
      default: true
      preset:
        default: true
        endpoint: "agents"
        agent_id: "agent_g81AUn460eTHJg8RczE3s"
    - name: "sales-engine"
      label: "Sales Assistant"
      description: "Products, quotes, call prep and follow-ups (sample company)"
      default: false
      preset:
        default: false
        endpoint: "agents"
        agent_id: "agent_ZTA-mY-88hWpx__7ayNzs"
