version: 1.3.4
cache: true
interface:
  endpointsMenu: false
  modelSelect: true
  parameters: false
  sidePanel: true
  presets: false
  bookmarks: false
  multiConvo: false
  prompts:
    use: false
    create: false
  agents:
    use: true
    create: true
    share: true
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: false
endpoints:
  assistants:
    disableBuilder: false
    pollIntervalMs: 750
    timeoutMs: 180000
    capabilities:
      - "code_interpreter"
      - "retrieval"
      - "actions"
      - "tools"
      - "image_vision"
mcpServers:
  hubspot:
    command: npx
    args:
      - -y
      - "@hubspot/mcp-server"
    env:
      PRIVATE_APP_ACCESS_TOKEN: "b34d4a00-7345-49ab-85fe-249d647f4a78"
    serverInstructions: true
    chatMenu: false
    timeout: 45000
  finance:
    type: streamable-http
    url: "https://convor-finance-mcp-production.up.railway.app/mcp"
    serverInstructions: true
    chatMenu: false
    timeout: 45000
modelSpecs:
  enforce: true
  prioritize: true
  addedEndpoints:
    - agents
  list:
    - name: "hr-engin
