version: 1.3.4
cache: true
interface:
  endpointsMenu: false
  modelSelect: true
  parameters: false
  sidePanel: true
  presets: false
  bookmarks: false
  multiConvo: false
  prompts:
    use: false
    create: false
  agents:
    use: true
    create: true
    share: false
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: false

mcpServers:
  hubspot:
    command: npx
    args:
      - -y
      - "@shinzolabs/hubspot-mcp"
    env:
      HUBSPOT_ACCESS_TOKEN: "b34d4a00-7345-49ab-85fe-249d647f4a78"
    serverInstructions: true
    chatMenu: false
    timeout: 45000

modelSpecs:
  enforce: true
  prioritize: true
  addedEndpoints:
   assistants:
    disableBuilder: false
    pollIntervalMs: 750
    timeoutMs: 180000
    capabilities:
      - "code_interpreter"
      - "retrieval"
      - "actions"
      - "tools"
      - "image_vision"
    - agents
  list:
    - name: "hr-engine"
      label: "HR Answer Engine"
      description: "Convor HR Portal"
      default: true
      preset:
        default: true
        endpoint: "agents"
        agent_id: "agent_usbMZAnx7CAN0WnIOjGyN"
    - name: "sales-engine"
      label: "Sales Intelligence Engine"
      description: "Robots.com Sales Assistant"
      default: false
      preset:
        default: false
        endpoint: "agents"
        agent_id: "agent_XAF7KrLM0wz2cZ-S4wqha"
