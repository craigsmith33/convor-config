version: 1.3.17
cache: true
fileStrategy: "local"
fileStrategies:
  default: "local"
  avatar: "local"
  image: "local"
  document: "s3"
interface:
  customWelcome: "Welcome to Convor AI"
  endpointsMenu: false
  modelSelect: false
  parameters: false
  sidePanel: true
  presets: false
  bookmarks: false
  multiConvo: false
  prompts:
    use: false
    create: false
  agents:
    use: true
    create: true
    share: true
  mcpServers:
    use: true
    create: false
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: true
  remoteAgents:
    use: true
    create: true
    share: false
    public: false
  memories: false
  skills: true
mcpSettings:
  allowedAddresses:
    - "quickbooks-connector.railway.internal:8080"
mcpServers:
  quickbooks:
    type: streamable-http
    title: "QuickBooks"
    description: "Read-only access to the connected QuickBooks Online company"
    url: "http://quickbooks-connector.railway.internal:8080/mcp"
    headers:
      Authorization: "Bearer ${QBO_MCP_SECRET}"
    timeout: 60000
    initTimeout: 30000
    chatMenu: false
    serverInstructions: false
    requiresOAuth: false
  hubspot:
    type: streamable-http
    title: "HubSpot"
    description: "Read-only HubSpot sales data (deals, contacts, activity, tasks) with QuickBooks balances and pricing"
    url: "http://quickbooks-connector.railway.internal:8080/mcp-crm"
    headers:
      Authorization: "Bearer ${QBO_MCP_SECRET}"
    timeout: 60000
    initTimeout: 30000
    chatMenu: false
    serverInstructions: false
    requiresOAuth: false
  make:
    type: streamable-http
    title: "Make"
    description: "Runs approved Make scenarios (proposal documents)"
    url: "https://us1.make.com/mcp?scenarioId=4979928"
    headers:
      Authorization: "Bearer ${MAKE_MCP_TOKEN}"
    timeout: 120000
    initTimeout: 30000
    chatMenu: false
    serverInstructions: false
    requiresOAuth: false
endpoints:
  assistants:
    disableBuilder: false
    pollIntervalMs: 750
    timeoutMs: 180000
    capabilities:
      - "code_interpreter"
      - "retrieval"
      - "actions"
      - "tools"
      - "image_vision"
modelSpecs:
  enforce: true
  prioritize: true
  addedEndpoints:
    - agents
  list:
    - name: "sales-engine"
      label: "Sales Assistant"
      description: "Pipeline, accounts, quotes and proposals from HubSpot and QuickBooks (sample company)"
      default: false
      preset:
        default: false
        endpoint: "agents"
        agent_id: "agent_ZTA-mY-88hWpx__7ayNzs"
    - name: "finance-engine"
      label: "Finance Assistant"
      description: "Cash, receivables, bills and profit from QuickBooks (sample company)"
      default: false
      preset:
        default: false
        endpoint: "agents"
        agent_id: "agent_pzx4BrXk9nE2y_fRNTA-g"
    - name: "helpdesk-engine"
      label: "Employee Help Desk"
      description: "Policies, benefits, leave and expenses, answered from company documents"
      default: true
      preset:
        default: true
        endpoint: "agents"
        agent_id: "agent_pC6dz1FShUHinMKvFgmZ2"
    - name: "hr-team-engine"
      label: "HR Team Assistant (HR team only)"
      description: "For the HR team: job descriptions, interview kits, resume screening, onboarding plans. Access is limited to the HR team."
      default: false
      preset:
        default: false
        endpoint: "agents"
        agent_id: "agent_A_xLXp9of-etmQ9jnriMu"
