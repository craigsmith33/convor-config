version: 1.3.4
cache: true
interface:
  endpointsMenu: false
  modelSelect: true
  parameters: false
  sidePanel: true
  presets: false
  bookmarks: false
  multiConvo: false
  prompts:
    use: false
    create: false
  agents:
    use: true
    create: true
    share: false
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: false

mcpServers:
  hubspot:
    type: streamable-http
    title: "HubSpot CRM"
    description: "Access HubSpot contacts, companies, deals, tickets, and more"
    url: "https://mcp.hubspot.com"
    serverInstructions: true
    timeout: 45000
    initTimeout: 150000
    startup: false
    chatMenu: false
    oauth:
      authorization_url: https://mcp.hubspot.com/oauth/authorize
      token_url: https://mcp.hubspot.com/oauth/v3/token
      client_id: "874d7c80-8167-41a1-9cfd-c1494b6a318f"
      client_secret: "53ade169-77cc-47d5-99ac-f529dcc7ba31"
      redirect_uri: https://ai.convor.ai/api/mcp/hubspot/oauth/callback
      scope: ""
      token_endpoint_auth_methods_supported: ["client_secret_post"]
      code_challenge_methods_supported: ["S256"]

mcpSettings:
  allowedDomains:
    - "mcp.hubspot.com"
    - "*.hubspot.com"

modelSpecs:
  enforce: true
  prioritize: true
  addedEndpoints:
    - agents
  list:
    - name: "hr-engine"
      label: "HR Answer Engine"
      description: "Convor HR Portal"
      default: true
      preset:
        default: true
        endpoint: "agents"
        agent_id: "agent_usbMZAnx7CAN0WnIOjGyN"
    - name: "sales-engine"
      label: "Sales Intelligence Engine"
      description: "Robots.com Sales Assistant"
      default: false
      preset:
        default: false
        endpoint: "agents"
        agent_id: "agent_XAF7KrLM0wz2cZ-S4wqha"
