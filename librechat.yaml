version: 1.3.4
cache: true
interface:
  endpointsMenu: false
  modelSelect: true
  parameters: false
  sidePanel: true
  presets: false
  bookmarks: false
  multiConvo: false
  prompts:
    use: false
    create: false
  agents:
    use: true
    create: true
    share: true
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: false
  remoteAgents:
    use: true
    create: true
    share: false
    public: false
endpoints:
  assistants:
    disableBuilder: false
    pollIntervalMs: 750
    timeoutMs: 180000
    capabilities:
      - "code_interpreter"
      - "retrieval"
      - "actions"
      - "tools"
      - "image_vision"
mcpServers:
  hubspot:
    command: npx
    args:
      - -y
      - "hubspot-mcp"
    env:
      HUBSPOT_API_KEY: "pat-na2-5ea80805-ae99-4443-8958-ea496189cb57"
    serverInstructions: true
    chatMenu: false
    timeout: 45000
  finance:
    type: streamable-http
    url: "https://convor-finance-mcp-production.up.railway.app/mcp"
    serverInstructions: true
    chatMenu: false
    timeout: 45000
modelSpecs:
  enforce: true
  prioritize: true
  addedEndpoints:
    - agents
  list:
    - name: "hr-engine"
      label: "HR Answer Engine"
      description: "Convor HR Portal"
      default: true
      preset:
        default: true
        endpoint: "agents"
        agent_id: "agent_g81AUn460eTHJg8RczE3s"
    - name: "sales-engine"
      label: "Sales Support Engine"
      description: "Sales Assistant"
      default: false
      preset:
        default: false
        endpoint: "agents"
        agent_id: "agent_9d9HDLNTNvgLKPMbRqN-U"
    - name: "finance-engine"
      label: "Finance Intelligence Engine"
      description: "Executive Financial Analysis"
      default: false
      preset:
        default: false
        endpoint: "agents"
        agent_id: "agent__-BeQ9Fk3FQBnhQCY4Dn2"
